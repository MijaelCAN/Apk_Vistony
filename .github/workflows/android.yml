name: Android CI

# Cuando se ejecuta:
#  - push a main (produccion) y a develop (integracion)
#  - cualquier pull request dirigido a esas ramas
#  - manualmente, desde el boton "Run workflow" en la pestana Actions
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

# Si llegan dos pushes seguidos a la misma rama, cancela la corrida anterior
# y deja solo la ultima. Evita gastar minutos en builds que ya quedaron viejos.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# El workflow solo necesita leer el codigo, no escribir en el repositorio.
permissions:
  contents: read

jobs:
  build:
    name: Compilar y probar
    runs-on: ubuntu-latest
    # Corta el job si se cuelga, para que no consuma minutos indefinidamente.
    timeout-minutes: 30

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      # El proyecto compila con Java 17 (jvmToolchain(17) en app/build.gradle.kts).
      # La cache de Gradle hace que las corridas siguientes sean bastante mas rapidas.
      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Red de seguridad: si alguien vuelve a commitear gradlew sin permiso de
      # ejecucion desde Windows, el runner Linux igual puede ejecutarlo.
      - name: Dar permiso de ejecucion a gradlew
        run: chmod +x gradlew

      # testDebugUnitTest en vez de test: corre solo la variante debug.
      # "test" ejecutaria tambien la variante release, duplicando el trabajo.
      - name: Ejecutar tests unitarios
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Compilar APK de debug
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publicar el APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # Solo se sube si algun paso anterior fallo, para poder ver que se rompio.
      - name: Publicar reporte de tests (solo si fallo)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-tests
          path: app/build/reports/tests/
          retention-days: 7